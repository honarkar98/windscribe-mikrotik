name: Update Windscribe IP List

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Windscribe RSC
        run: python3 generate.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet windscribe.rsc; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to windscribe.rsc"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in windscribe.rsc"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windscribe.rsc
          git commit -m "Update Windscribe IP list"
          git push